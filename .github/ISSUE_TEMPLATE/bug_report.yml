name: Bug report
description: Something in doot doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `vyom list`, your compositor and distribution.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Daemon log
      description: Anything relevant from `~/.local/state/vyom/daemon.log` (a Traceback especially).
      render: text
